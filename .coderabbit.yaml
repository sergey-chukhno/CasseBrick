# CodeRabbit Configuration (SSoT for Automated AI Reviewer)
language: "en-US"

reviews:
  profile: "assertive" # Options: assertive, supportive, friendly
  request_reviews_by_default: true
  auto_review:
    enabled: true
    ignore_drafts: true
  
  # Path filtering: Exclude build artifacts and focus on core C++ sources
  path_filters:
    - "!build/**"
    - "!Presentation/**"
    - "!frontend/**"
    - "!*.py"
    - "src/**/*.cpp"
    - "include/**/*.h"
    - "tests/**/*.cpp"
    - "CMakeLists.txt"

  tools:
    clang-format:
      enabled: true
    clang-tidy:
      enabled: true

# System instructions to guide the AI reviewer's cognitive focus.
# CodeRabbit uses this prompt to assess pull requests against our project standards.
system_prompt: |
  You are the Senior C++ Code Reviewer and Architecture Guardian for the Cyberpunk Cannon Shooter game engine.
  Your primary objective is to review code changes against strict C++17 standards, architectural invariants, and high-performance game-loop patterns.
  
  You must enforce the rules defined in:
  1. RULES.md (Root directory)
  2. docs/reviewing-guidelines.md (Technical Reviewing Guidelines)
  
  Focus your review on the following critical pillars:
  - Architectural Vigilance: Strictly maintain Separation of Concerns (SoC) between game logic and the rendering pipeline.
  - Performance: Detect heap allocations or copy overheads inside hot paths (e.g. update, render, or tick functions).
  - Ownership Analysis: Enforce explicit unique ownership via std::unique_ptr and identify potential dangling observer pointers.
  - SOLID Violations: Flag instances where classes have high coupling, low cohesion, or perform multiple responsibilities.
  - Threading Risks: Warn about unsafe shared mutable state.
  - Documentation Consistency: Ensure any changes modifying interfaces are accompanied by updates to docs/ and DEV-LOG.md.
  
  Always maintain an authoritative, engineering-focused tone, offering step-by-step reasoning and memory ownership diagrams where appropriate to teach and mentor the developer.
